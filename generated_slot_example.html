<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Slot Demo</title>
<style>
  body{font-family:Arial;text-align:center;padding:40px}
  .reel{display:inline-block;width:90px;height:90px;border:2px solid #222;margin:6px;font-size:48px;line-height:90px}
  #controls{margin-top:20px}
</style>
</head>
<body>
  <h1>Slot Demo</h1>
  <div id="reels">
    <div class="reel" id="r0">🍒</div>
    <div class="reel" id="r1">🍋</div>
    <div class="reel" id="r2">⭐️</div>
  </div>
  <div id="controls">
    <button id="spin">Girar (1 crédito)</button>
    <div>Créditos: <span id="credits">10</span></div>
    <div id="message"></div>
  </div>

<script>
const symbols = ['🍒','🍋','⭐️','🔔'];
let credits = 10;
document.getElementById('credits').textContent = credits;
document.getElementById('spin').addEventListener('click', spin);

function spin() {
  if (credits <= 0) { showMsg('Sem créditos'); return; }
  credits -= 1;
  document.getElementById('credits').textContent = credits;
  showMsg('Girando...');
  // animação simples
  const spins = 20;
  for (let i=0;i<spins;i++) {
    setTimeout(()=> {
      for (let r=0;r<3;r++){
        const sym = symbols[Math.floor(Math.random()*symbols.length)];
        document.getElementById('r'+r).textContent = sym;
      }
    }, i*80);
  }
  // resultado final
  setTimeout(()=> {
    const result = [];
    for (let r=0;r<3;r++){
      result[r] = symbols[Math.floor(Math.random()*symbols.length)];
      document.getElementById('r'+r).textContent = result[r];
    }
    const payout = evaluate(result);
    if (payout>0) {
      credits += payout;
      document.getElementById('credits').textContent = credits;
      showMsg('Ganhou ' + payout + ' créditos!');
    } else showMsg('Tente novamente');
  }, spins*80 + 100);
}

function evaluate(arr){
  // regra simples: 3 iguais = 10, 2 iguais = 2
  if (arr[0]===arr[1] && arr[1]===arr[2]) return 10;
  if (arr[0]===arr[1] || arr[0]===arr[2] || arr[1]===arr[2]) return 2;
  return 0;
}

function showMsg(t){ document.getElementById('message').textContent = t; }
</script>
</body>
</html>
